<!DOCTYPE html>
<html>
<head>
  <title>{{ title }}</title>

  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: #e2e8f0;
    }

    .navbar {
      background: #1e293b;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }

    .container {
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      border-left: 4px solid #38bdf8;
    }
  </style>
</head>
<body>

  <div class="navbar">
    🏀 NBA Stats Dashboard
  </div>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
