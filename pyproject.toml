[project]
name = "fastapi-nba"
version = "0.1.0"
description = "Nba Fantasy Predict"
authors = [
    {name = "ssmunkhbat",email = "47767779+ssmunkhbat@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.120.0,<0.121.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "nba-api (>=1.10.2,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytz (>=2026.1.post1,<2027.0)",
    "feedparser (>=6.0.12,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
